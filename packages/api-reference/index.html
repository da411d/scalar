<!doctype html>
<html>
  <head>
    <title>Scalar API Reference</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <div id="app"></div>

    <!-- Our Script -->
    <script
      src="src/standalone.ts"
      type="module"></script>

    <!-- Initialize the Scalar API Reference -->
    <script type="module">
      import { PostHogPlugin } from './src/plugins/posthog-plugin.ts'
      import { sources } from './test/utils/sources.ts'

      const posthogApiKey = import.meta.env.VITE_POSTHOG_API_KEY
      const posthogApiHost = import.meta.env.VITE_POSTHOG_API_HOST
      const plugins =
        posthogApiKey && posthogApiHost
          ? [
              PostHogPlugin({
                apiKey: posthogApiKey,
                apiHost: posthogApiHost,
              }),
            ]
          : []

      Scalar.createApiReference('#app', {
        sources,
        persistAuth: true,
        plugins,
        // Avoid CORS issues
        proxyUrl: 'https://proxy.scalar.com',
      })
    </script>
  </body>
</html>
